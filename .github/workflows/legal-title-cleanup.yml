name: Legal title cleanup
on:
  push:
    paths: ['.github/workflows/legal-title-cleanup.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove protected title
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('README.md')
          s=p.read_text()
          s=s.replace('AI Infrastructure Engineer · Multi-Agent Systems · TypeScript Purist','AI Infrastructure Developer · Multi-Agent Systems · TypeScript Purist')
          p.write_text(s)
          PY
          rm .github/workflows/legal-title-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .github/workflows/legal-title-cleanup.yml
          git commit -m 'fix: remove protected engineer title' && git push
