# ==============================================================================
# CI Pipeline - Profile Repository Quality Gate
# ==============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality & Link Verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20

      - name: Verify TypeScript Compilation
        run: |
          npm ci
          npx tsc --noEmit

      - name: Verify Markdown Links Reachability
        run: |
          python3 -c "
          import re, urllib.request
          with open('README.md', 'r') as f:
              content = f.read()
          urls = re.findall(r'https?://[^\s\)\"\'\>]+', content)
          print(f'Auditing {len(urls)} profile URLs...')
          for u in urls:
              req = urllib.request.Request(u, headers={'User-Agent': 'Mozilla/5.0'})
              res = urllib.request.urlopen(req, timeout=10)
              assert res.status in (200, 301, 302), f'URL failed: {u} -> {res.status}'
          print('All profile links verified 100% active.')
          "

  test:
    name: Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run Tests
        run: node --test test/*.test.mjs

